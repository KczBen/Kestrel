variables:
  VCPKG_ROOT: "${CI_PROJECT_DIR}/vcpkg"
  VCPKG_DEFAULT_BINARY_CACHE: "${CI_PROJECT_DIR}/.vcpkg-binary-cache"
  VCPKG_DISABLE_METRICS: "1"
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
  GIT_DEPTH: "0"


stages:
  - build
  - test

.vcpkg_cache: &vcpkg_cache
  key:
    files:
      - vcpkg.json
    prefix: "vcpkg-${CI_COMMIT_REF_SLUG}"
  paths:
    - .vcpkg-binary-cache/
    - out/build/Debug/vcpkg_installed/
    - out/build/coverage/vcpkg_installed/
  policy: pull-push

.linux_setup:
  image: ubuntu:25.10

  before_script:
    - export DEBIAN_FRONTEND=noninteractive
    - apt-get update -qq
    - apt-get install -y --no-install-recommends
        cmake ninja-build git curl zip unzip tar pkg-config ca-certificates
        clang-21 lld-21 libc++-21-dev libc++abi-21-dev
        libvulkan-dev glslang-tools spirv-tools
        libsdl3-dev clang-tools-21 llvm-21 libclang-rt-21-dev
        
    - update-alternatives --install /usr/bin/clang   clang   /usr/bin/clang-21   100
    - update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-21 100
    - update-alternatives --install /usr/bin/llvm-profdata llvm-profdata /usr/lib/llvm-21/bin/llvm-profdata 100
    - update-alternatives --install /usr/bin/llvm-cov      llvm-cov      /usr/lib/llvm-21/bin/llvm-cov     100

    - |
      if [ ! -f "${VCPKG_ROOT}/bootstrap-vcpkg.sh" ]; then
        rm -rf "${VCPKG_ROOT}"
        git clone --depth 1 https://github.com/microsoft/vcpkg.git "${VCPKG_ROOT}"
      fi
    - "${VCPKG_ROOT}/bootstrap-vcpkg.sh"
    - mkdir -p "${VCPKG_DEFAULT_BINARY_CACHE}"

build:
  extends: .linux_setup
  stage: build

  cache:
    - <<: *vcpkg_cache

  script:
    - cmake --preset Debug
    - cmake --build --preset "Build - Debug" --parallel $(nproc)

coverage:
  extends: .linux_setup
  stage: test

  before_script:
    - !reference [.linux_setup, before_script]

  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

  cache:
    - <<: *vcpkg_cache
      policy: pull

  script:
    - cmake --preset clang-coverage
    - cmake --build out/build/coverage --parallel $(nproc)
    - cd out/build/coverage
    - ctest --output-on-failure
    - |
      llvm-cov report \
        ./test-bin \
        -object ./librender.a \
        -object ./libvulkan-wrapper.a \
        -object ./libutil.a \
        -instr-profile=coverage.profdata \
        -ignore-filename-regex=".*/tests/.*"

  coverage: '/TOTAL.*\s+(\d+\.\d+%)/'

  artifacts:
    when: always
    expire_in: 2 weeks
    paths:
      - out/build/coverage/Testing/
      - out/build/coverage/coverage-html/

pages:
  stage: test
  needs: ["coverage"]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - cp -r out/build/coverage/coverage-html/ public/
  artifacts:
    paths:
      - public/

get-sonar-binaries:
  stage: .pre
  cache:
    policy: push
    key: "${CI_COMMIT_SHORT_SHA}"
    paths:
      - build-wrapper/
      - sonar-scanner/
  script:
    # Download sonar-scanner
    - curl -sSLo ./sonar-scanner.zip 'https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-8.0.1.6346-linux-x64.zip'
    - unzip -o sonar-scanner.zip
    - mv sonar-scanner-8.0.1.6346-linux-x64 sonar-scanner
    # Download build-wrapper
    - curl -sSLo ./build-wrapper-linux-x86.zip "${SONAR_HOST_URL}/static/cpp/build-wrapper-linux-x86.zip"
    - unzip -oj build-wrapper-linux-x86.zip -d ./build-wrapper
  only:
    - merge_requests
    - master
    - develop

sonar-build:
  stage: build
  cache:
    policy: pull-push
    key: "${CI_COMMIT_SHORT_SHA}"
    paths:
      - build-wrapper/
      - sonar-scanner/
  script:
    # Run the build inside the build wrapper
    - build-wrapper/build-wrapper-linux-x86-64 --out-dir bw-output cmake --preset Debug && cmake --build --preset "Build - Debug" --parallel $(nproc)
    # Run the sonar-scanner in the same stage as the build
    - sonar-scanner/bin/sonar-scanner -Dsonar.host.url="${SONAR_HOST_URL}" -Dsonar.token="${SONAR_TOKEN}" -Dsonar.cfamily.compile-commands=bw-output/compile_commands.json
  only:
    - merge_requests
    - master
    - develop